<title>Dog Timeline</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="static/css/style.css">

<header>
  <h1>Dog Timeline</h1>
  <div class="tagline">A visualizer for when each dog breed came into being</div>
  <div class="sub" id="header-sub">Loading…</div>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Find a breed…">
  <div class="mode-toggle">
    <button data-mode="founding" class="active" title="Plot each breed by when its own population/landrace became distinct">Breed founding</button>
    <button data-mode="ancestor" title="Plot each breed by its oldest known common ancestor (MRCA) — genetic-purity/lineage-depth, not founding date">Oldest common ancestor</button>
  </div>
  <div class="legend">
    <span class="legend-founding"><span class="dot" style="background:var(--rich)"></span>rich (multiple dated sources)</span>
    <span class="legend-founding"><span class="dot" style="background:var(--anchor)"></span>anchor (1–2 dates)</span>
    <span class="legend-founding"><span class="dot" style="background:var(--vague)"></span>vague</span>
    <span class="legend-ancestor"><span class="dot" style="background:var(--ancestor)"></span>ancestor lineage (MRCA)</span>
    <span><span class="star" style="color:var(--favorite)">&#9733;</span>favorite</span>
    <span class="legend-founding" title="Date reflects the associated culture/people, not direct evidence of the dog itself">* = culture-inferred date</span>
  </div>
  <div class="scale-note" id="scale-note">Log scale — recent centuries are stretched, deep history is compressed</div>
</div>

<div id="timeline-wrap">
  <svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div id="undated">
  <h3>Not yet plottable</h3>
  <div class="sub" id="undated-sub"></div>
  <div class="chip-list" id="undated-list"></div>
</div>

<div id="tooltip"></div>
<div id="detail">
  <button class="close" id="detail-close">&times;</button>
  <div id="detail-body"></div>
</div>

<script src="data/data.js"></script>
<script src="static/js/timeline.js"></script>
